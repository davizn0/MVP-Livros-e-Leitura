{% extends "base.html" %}

{% block title %}Entrar | Livros e Leitura{% endblock %}

{% block content %}
<section class="card">
    <h1>Entrar</h1>
    <p>Acesse sua conta de voluntário.</p>

    <form method="post">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required>

        <button type="submit">Entrar</button>
    </form>

    {% if erro %}
        <p class="error">{{ erro }}</p>
    {% endif %}

    <p><a href="/">Ver itens que a ONG precisa</a></p>
</section>
{% endblock %}
