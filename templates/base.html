<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Livros e Leitura{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="brand">
    <div class="logo">LL</div>
    <div>
      <div class="name">Livros e Leitura</div>
      <div class="sub">Biblioteca Social Riacho Fundo II</div>
    </div>
  </header>
  <div class="acessibilidade">
    <button type="button" onclick="aumentarTexto()">A+</button>
    <button type="button" onclick="diminuirTexto()">A-</button>
    <button type="button" onclick="alternarContraste()">Alto contraste</button>
  </div>
  {% with mensagens = get_flashed_messages() %}
    {% if mensagens %}
      <ul class="flashes">{% for m in mensagens %}<li class="flash">{{ m }}</li>{% endfor %}</ul>
    {% endif %}
  {% endwith %}
  <main class="container">
    {% block content %}{% endblock %}
  </main>
<script>
  var zoom = 1;

  function aumentarTexto() {
    zoom = zoom + 0.15;
    document.body.style.zoom = zoom;
  }

  function diminuirTexto() {
    zoom = zoom - 0.15;
    document.body.style.zoom = zoom;
  }

  function alternarContraste() {
    document.body.classList.toggle("alto-contraste");
  }
</script>
</body>
</html>
